[package]
name = "recallly-probe"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.2", features = ["rt", "io-std", "macros"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
windows-timezones = "=0.5.1"
windows-sys = { version = "=0.61.2", features = ["Win32_System_Time"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chrono-tz = "=0.10.4"
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
